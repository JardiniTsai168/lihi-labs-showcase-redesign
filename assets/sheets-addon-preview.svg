<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title description">
  <title id="title">Google 試算表外掛功能預覽</title>
  <desc id="description">在 Google 試算表輸入 LIHI 指令，將原始網址批次轉換成短網址</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#fffafd"/>
      <stop offset="1" stop-color="#f2efff"/>
    </linearGradient>
    <linearGradient id="brand" x2="1" y2="1">
      <stop stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#1a1a5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1a1a5e" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="800" height="450" rx="34" fill="url(#background)"/>
  <circle cx="704" cy="80" r="104" fill="#ffd7e4" opacity=".7"/>
  <circle cx="96" cy="390" r="116" fill="#ece8ff" opacity=".75"/>

  <g filter="url(#shadow)">
    <rect x="42" y="54" width="716" height="342" rx="28" fill="#fffdfd"/>
  </g>
  <rect x="42" y="54" width="716" height="58" rx="28" fill="#1a1a5e"/>
  <path d="M42 84h716v28H42z" fill="#1a1a5e"/>

  <g font-family="Arial, sans-serif">
    <rect x="68" y="70" width="28" height="28" rx="6" fill="#34a853"/>
    <path d="M75 76h10l5 5v13H75z" fill="#fff" opacity=".94"/>
    <path d="M85 76v6h5" fill="none" stroke="#34a853" stroke-width="2"/>
    <text x="110" y="91" fill="#fff" font-size="17" font-weight="700">行銷連結管理</text>
    <circle cx="706" cy="83" r="7" fill="#ff6b9d"/>
    <circle cx="728" cy="83" r="7" fill="#fff" opacity=".5"/>

    <rect x="66" y="132" width="668" height="44" rx="12" fill="#fff0f5"/>
    <text x="84" y="159" fill="#1a1a5e" font-size="17" font-weight="700">fx</text>
    <text x="120" y="160" fill="#1a1a5e" font-size="18" font-weight="700">=LIHI(A2)</text>

    <rect x="66" y="194" width="54" height="42" fill="#f3efff"/>
    <rect x="120" y="194" width="320" height="42" fill="#ffe8f0"/>
    <rect x="440" y="194" width="294" height="42" fill="#eae7fa"/>
    <text x="86" y="220" fill="#1a1a5e" font-size="14" font-weight="700">#</text>
    <text x="140" y="220" fill="#1a1a5e" font-size="14" font-weight="700">原始網址</text>
    <text x="460" y="220" fill="#1a1a5e" font-size="14" font-weight="700">lihi 短網址</text>

    <g font-size="13" fill="#1a1a5e">
      <rect x="66" y="236" width="54" height="46" fill="#fff" stroke="#1a1a5e" stroke-opacity=".08"/>
      <rect x="120" y="236" width="320" height="46" fill="#fff" stroke="#1a1a5e" stroke-opacity=".08"/>
      <rect x="440" y="236" width="294" height="46" fill="#fff" stroke="#ff6b9d" stroke-width="3"/>
      <text x="88" y="264" font-weight="700">2</text>
      <text x="140" y="264" opacity=".58">https://brand.com/summer-sale</text>
      <text x="460" y="264" fill="#c8326a" font-weight="700">lihi.cc/Summer</text>

      <rect x="66" y="282" width="54" height="46" fill="#faf9fc" stroke="#1a1a5e" stroke-opacity=".08"/>
      <rect x="120" y="282" width="320" height="46" fill="#faf9fc" stroke="#1a1a5e" stroke-opacity=".08"/>
      <rect x="440" y="282" width="294" height="46" fill="#faf9fc" stroke="#1a1a5e" stroke-opacity=".08"/>
      <text x="88" y="310" font-weight="700">3</text>
      <text x="140" y="310" opacity=".58">https://brand.com/new-product</text>
      <text x="460" y="310" fill="#c8326a" font-weight="700">lihi.cc/New</text>

      <rect x="66" y="328" width="54" height="46" fill="#fff" stroke="#1a1a5e" stroke-opacity=".08"/>
      <rect x="120" y="328" width="320" height="46" fill="#fff" stroke="#1a1a5e" stroke-opacity=".08"/>
      <rect x="440" y="328" width="294" height="46" fill="#fff" stroke="#1a1a5e" stroke-opacity=".08"/>
      <text x="88" y="356" font-weight="700">4</text>
      <text x="140" y="356" opacity=".58">https://brand.com/event</text>
      <text x="460" y="356" fill="#c8326a" font-weight="700">lihi.cc/Event</text>
    </g>

    <rect x="618" y="134" width="116" height="38" rx="12" fill="url(#brand)"/>
    <text x="638" y="159" fill="#fff" font-size="13" font-weight="700">批次建立完成</text>
  </g>
</svg>
