<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">lihiAgentMCP 功能預覽</title>
  <desc id="desc">Agent 透過 lihiAgentMCP 建立短網址、廣告文案與素材的流程圖</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffafd"/>
      <stop offset="1" stop-color="#ffe7ef"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#1a1a5e"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#ff6b9d" opacity=".16"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1a1a5e" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="800" height="450" rx="34" fill="url(#bg)"/>
  <rect width="800" height="450" rx="34" fill="url(#dots)"/>
  <circle cx="686" cy="72" r="104" fill="#ff6b9d" opacity=".08"/>
  <circle cx="104" cy="374" r="120" fill="#1a1a5e" opacity=".05"/>

  <g filter="url(#shadow)">
    <rect x="52" y="132" width="172" height="186" rx="28" fill="#fffdfd" stroke="#1a1a5e" stroke-opacity=".12"/>
    <circle cx="138" cy="198" r="38" fill="#1a1a5e"/>
    <circle cx="126" cy="190" r="6" fill="#fff5f8"/>
    <circle cx="150" cy="190" r="6" fill="#fff5f8"/>
    <path d="M120 210c10 10 26 10 36 0" fill="none" stroke="#ff6b9d" stroke-width="6" stroke-linecap="round"/>
    <text x="138" y="272" text-anchor="middle" fill="#1a1a5e" font-family="Arial, sans-serif" font-size="24" font-weight="700">YOUR AGENT</text>
  </g>

  <path d="M238 225h64" fill="none" stroke="#ff6b9d" stroke-width="6" stroke-linecap="round"/>
  <path d="m290 212 14 13-14 13" fill="none" stroke="#ff6b9d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="316" y="92" width="220" height="266" rx="32" fill="url(#brand)"/>
    <rect x="344" y="120" width="82" height="30" rx="15" fill="#fffdfd" fill-opacity=".16"/>
    <text x="385" y="141" text-anchor="middle" fill="#fffdfd" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">MCP</text>
    <text x="344" y="198" fill="#fffdfd" font-family="Arial, sans-serif" font-size="28" font-weight="700">lihiAgent</text>
    <text x="344" y="229" fill="#fffdfd" font-family="Arial, sans-serif" font-size="28" font-weight="700">MCP</text>
    <rect x="344" y="267" width="164" height="2" rx="1" fill="#fffdfd" fill-opacity=".32"/>
    <circle cx="360" cy="306" r="8" fill="#ffb2cb"/>
    <rect x="378" y="299" width="112" height="14" rx="7" fill="#fffdfd" fill-opacity=".72"/>
  </g>

  <path d="M550 225h46" fill="none" stroke="#1a1a5e" stroke-width="6" stroke-linecap="round"/>
  <path d="m584 212 14 13-14 13" fill="none" stroke="#1a1a5e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)" font-family="Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="612" y="116" width="142" height="58" rx="20" fill="#fffdfd"/>
    <circle cx="640" cy="145" r="10" fill="#ff6b9d"/>
    <text x="660" y="152" fill="#1a1a5e">短網址</text>

    <rect x="612" y="196" width="142" height="58" rx="20" fill="#fffdfd"/>
    <circle cx="640" cy="225" r="10" fill="#8f67db"/>
    <text x="660" y="232" fill="#1a1a5e">文案</text>

    <rect x="612" y="276" width="142" height="58" rx="20" fill="#fffdfd"/>
    <circle cx="640" cy="305" r="10" fill="#1a1a5e"/>
    <text x="660" y="312" fill="#1a1a5e">素材</text>
  </g>
</svg>
