<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title description">
  <title id="title">客服報表系統功能預覽</title>
  <desc id="description">客服訊息經過 AI 分類後轉換成分析報表與服務盲點提醒</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#fffafd"/>
      <stop offset="1" stop-color="#f3efff"/>
    </linearGradient>
    <linearGradient id="brand" x2="1" y2="1">
      <stop stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#1a1a5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a1a5e" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="800" height="450" rx="34" fill="url(#background)"/>
  <circle cx="116" cy="370" r="112" fill="#ffe2ec" opacity=".72"/>
  <circle cx="694" cy="86" r="102" fill="#ffd4e2" opacity=".62"/>

  <g filter="url(#shadow)">
    <rect x="48" y="78" width="220" height="294" rx="28" fill="#fffdfd"/>
    <rect x="290" y="116" width="164" height="216" rx="30" fill="url(#brand)"/>
    <rect x="476" y="58" width="276" height="334" rx="28" fill="#fffdfd"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="76" y="116" fill="#1a1a5e" font-size="18" font-weight="700">客服訊息</text>
    <g>
      <rect x="76" y="140" width="154" height="48" rx="16" fill="#fff0f5"/>
      <circle cx="98" cy="164" r="10" fill="#ff6b9d"/>
      <rect x="118" y="154" width="84" height="8" rx="4" fill="#1a1a5e" opacity=".78"/>
      <rect x="118" y="169" width="60" height="7" rx="3.5" fill="#1a1a5e" opacity=".24"/>
      <rect x="76" y="202" width="154" height="48" rx="16" fill="#f2efff"/>
      <circle cx="98" cy="226" r="10" fill="#1a1a5e"/>
      <rect x="118" y="216" width="92" height="8" rx="4" fill="#1a1a5e" opacity=".78"/>
      <rect x="118" y="231" width="68" height="7" rx="3.5" fill="#1a1a5e" opacity=".24"/>
      <rect x="76" y="264" width="154" height="48" rx="16" fill="#fff0f5"/>
      <circle cx="98" cy="288" r="10" fill="#ff8db3"/>
      <rect x="118" y="278" width="74" height="8" rx="4" fill="#1a1a5e" opacity=".78"/>
      <rect x="118" y="293" width="82" height="7" rx="3.5" fill="#1a1a5e" opacity=".24"/>
    </g>

    <path d="M250 225h54" stroke="#ff6b9d" stroke-width="6" stroke-linecap="round"/>
    <path d="m294 213 14 12-14 12" fill="none" stroke="#ff6b9d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="346" y="176" fill="#fff" font-size="16" font-weight="700">AI 分析</text>
    <circle cx="372" cy="220" r="34" fill="#fff" opacity=".16"/>
    <path d="M352 220h40M372 200v40" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <text x="326" y="286" fill="#fff" font-size="14" font-weight="700" opacity=".86">分類 · 整理 · 洞察</text>
    <path d="M440 225h52" stroke="#1a1a5e" stroke-width="6" stroke-linecap="round"/>
    <path d="m482 213 14 12-14 12" fill="none" stroke="#1a1a5e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="506" y="100" fill="#1a1a5e" font-size="18" font-weight="700">客服洞察報表</text>
    <rect x="506" y="124" width="216" height="54" rx="17" fill="#fff0f5"/>
    <text x="526" y="146" fill="#1a1a5e" font-size="12" font-weight="700">本週訊息</text>
    <text x="526" y="166" fill="#1a1a5e" font-size="22" font-weight="700">1,248</text>
    <text x="648" y="158" fill="#d83f79" font-size="14" font-weight="700">+18%</text>

    <g font-size="12" font-weight="700" fill="#1a1a5e">
      <text x="506" y="214">商品問題</text>
      <rect x="580" y="202" width="132" height="14" rx="7" fill="#f1edf7"/>
      <rect x="580" y="202" width="108" height="14" rx="7" fill="#ff6b9d"/>
      <text x="506" y="248">訂單進度</text>
      <rect x="580" y="236" width="132" height="14" rx="7" fill="#f1edf7"/>
      <rect x="580" y="236" width="82" height="14" rx="7" fill="#8a4c9d"/>
      <text x="506" y="282">退換貨</text>
      <rect x="580" y="270" width="132" height="14" rx="7" fill="#f1edf7"/>
      <rect x="580" y="270" width="54" height="14" rx="7" fill="#1a1a5e"/>
    </g>

    <rect x="506" y="312" width="216" height="50" rx="16" fill="#1a1a5e"/>
    <circle cx="532" cy="337" r="12" fill="#ff6b9d"/>
    <path d="M532 329v10M532 346v1" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="554" y="333" fill="#fff" font-size="12" font-weight="700">服務盲點</text>
    <text x="554" y="350" fill="#fff" font-size="11" opacity=".72">退換貨回覆時間偏長</text>
  </g>
</svg>
