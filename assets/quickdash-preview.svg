<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title description">
  <title id="title">快客數據功能預覽</title>
  <desc id="description">整合多個行銷平台的數據，集中產出報表與 AI 優化洞察</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#fffafd"/>
      <stop offset="1" stop-color="#f2efff"/>
    </linearGradient>
    <linearGradient id="brand" x2="1" y2="1">
      <stop stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#1a1a5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1a1a5e" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="800" height="450" rx="34" fill="url(#background)"/>
  <circle cx="705" cy="64" r="112" fill="#ffd7e4" opacity=".68"/>
  <circle cx="84" cy="400" r="120" fill="#e9e5ff" opacity=".74"/>

  <g font-family="Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="42" y="52" width="716" height="346" rx="28" fill="#fffdfd"/>
    </g>

    <rect x="42" y="52" width="716" height="58" rx="28" fill="#1a1a5e"/>
    <path d="M42 82h716v28H42z" fill="#1a1a5e"/>
    <rect x="68" y="70" width="28" height="28" rx="8" fill="#ff6b9d"/>
    <path d="M75 88l6-7 5 4 5-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="91" fill="#fff" font-size="18" font-weight="700">快客數據｜行銷總覽</text>
    <circle cx="706" cy="81" r="7" fill="#ff6b9d"/>
    <circle cx="728" cy="81" r="7" fill="#fff" opacity=".5"/>

    <g font-size="13" font-weight="700" text-anchor="middle">
      <rect x="66" y="136" width="106" height="42" rx="13" fill="#eef0ff"/>
      <text x="119" y="162" fill="#1a1a5e">META</text>
      <rect x="184" y="136" width="106" height="42" rx="13" fill="#fff0f5"/>
      <text x="237" y="162" fill="#c8326a">GA4</text>
      <rect x="302" y="136" width="106" height="42" rx="13" fill="#eef0ff"/>
      <text x="355" y="162" fill="#1a1a5e">GOOGLE ADS</text>
      <rect x="420" y="136" width="106" height="42" rx="13" fill="#fff0f5"/>
      <text x="473" y="162" fill="#c8326a">LINE</text>
    </g>

    <path d="M119 190v24h354v-24M237 190v24M355 190v24" fill="none" stroke="#1a1a5e" stroke-width="3" stroke-linecap="round" opacity=".22"/>
    <path d="M296 214v18" fill="none" stroke="#ff6b9d" stroke-width="4" stroke-linecap="round"/>

    <rect x="66" y="232" width="460" height="132" rx="20" fill="#f8f6ff" stroke="#1a1a5e" stroke-opacity=".08"/>
    <text x="88" y="260" fill="#1a1a5e" font-size="14" font-weight="700">跨平台成效趨勢</text>
    <path d="M92 334h400M92 308h400M92 282h400" fill="none" stroke="#1a1a5e" stroke-opacity=".08"/>
    <path d="M96 334c46-10 69-34 112-29s61 21 99 5 60-49 96-42 48 25 83 6" fill="none" stroke="url(#brand)" stroke-width="8" stroke-linecap="round"/>
    <g fill="#ff6b9d">
      <circle cx="96" cy="334" r="6"/>
      <circle cx="208" cy="305" r="6"/>
      <circle cx="307" cy="310" r="6"/>
      <circle cx="403" cy="268" r="6"/>
      <circle cx="486" cy="274" r="6"/>
    </g>

    <rect x="546" y="136" width="188" height="228" rx="20" fill="#1a1a5e"/>
    <text x="570" y="168" fill="#ff9fbd" font-size="12" font-weight="700" letter-spacing="1">AI INSIGHT</text>
    <text x="570" y="201" fill="#fff" font-size="19" font-weight="700">找到提升 ROAS</text>
    <text x="570" y="225" fill="#fff" font-size="19" font-weight="700">的關鍵</text>
    <rect x="570" y="250" width="140" height="8" rx="4" fill="#fff" opacity=".22"/>
    <rect x="570" y="250" width="104" height="8" rx="4" fill="#ff6b9d"/>
    <rect x="570" y="274" width="112" height="8" rx="4" fill="#fff" opacity=".18"/>
    <rect x="570" y="298" width="126" height="42" rx="13" fill="url(#brand)"/>
    <text x="633" y="324" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">查看優化建議</text>
  </g>
</svg>
