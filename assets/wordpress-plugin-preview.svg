<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title description">
  <title id="title">lihi WordPress Plugin 功能預覽</title>
  <desc id="description">在 WordPress 後台的文章與媒體清單直接建立、複製 lihi 短網址</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#fffafd"/>
      <stop offset="1" stop-color="#f1efff"/>
    </linearGradient>
    <linearGradient id="action" x2="1" y2="1">
      <stop stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#d93c75"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1a1a5e" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="800" height="450" rx="34" fill="url(#background)"/>
  <circle cx="722" cy="66" r="108" fill="#ffd9e6" opacity=".72"/>
  <circle cx="80" cy="410" r="126" fill="#e9e5ff" opacity=".78"/>

  <g filter="url(#shadow)">
    <rect x="42" y="45" width="716" height="360" rx="28" fill="#fffdfd"/>
  </g>
  <rect x="42" y="45" width="716" height="58" rx="28" fill="#1a1a5e"/>
  <path d="M42 75h716v28H42z" fill="#1a1a5e"/>
  <rect x="42" y="103" width="154" height="302" fill="#f4f1fa"/>

  <g font-family="Arial, sans-serif">
    <circle cx="75" cy="74" r="17" fill="#fff"/>
    <text x="75" y="81" text-anchor="middle" fill="#1a1a5e" font-size="20" font-weight="700">W</text>
    <text x="104" y="80" fill="#fff" font-size="17" font-weight="700">WordPress</text>
    <circle cx="714" cy="74" r="8" fill="#ff6b9d"/>

    <text x="68" y="143" fill="#1a1a5e" font-size="13" font-weight="700">文章</text>
    <rect x="67" y="160" width="102" height="9" rx="5" fill="#1a1a5e" opacity=".13"/>
    <text x="68" y="210" fill="#1a1a5e" font-size="13" font-weight="700">頁面</text>
    <rect x="67" y="227" width="82" height="9" rx="5" fill="#1a1a5e" opacity=".13"/>
    <text x="68" y="277" fill="#1a1a5e" font-size="13" font-weight="700">媒體庫</text>
    <rect x="67" y="294" width="94" height="9" rx="5" fill="#1a1a5e" opacity=".13"/>

    <text x="226" y="145" fill="#1a1a5e" font-size="22" font-weight="700">所有文章</text>
    <rect x="226" y="165" width="500" height="42" rx="11" fill="#fff0f5"/>
    <text x="246" y="191" fill="#1a1a5e" font-size="13" font-weight="700">文章標題</text>
    <text x="519" y="191" fill="#1a1a5e" font-size="13" font-weight="700">lihi Short URL</text>

    <g font-size="13">
      <rect x="226" y="217" width="500" height="58" rx="12" fill="#fff" stroke="#1a1a5e" stroke-opacity=".09"/>
      <text x="246" y="251" fill="#1a1a5e" font-weight="700">夏季新品上市</text>
      <rect x="542" y="228" width="158" height="36" rx="11" fill="url(#action)"/>
      <text x="621" y="251" text-anchor="middle" fill="#fff" font-weight="700">建立短網址</text>

      <rect x="226" y="285" width="500" height="58" rx="12" fill="#faf9fc" stroke="#1a1a5e" stroke-opacity=".09"/>
      <text x="246" y="319" fill="#1a1a5e" font-weight="700">品牌故事專訪</text>
      <rect x="542" y="296" width="158" height="36" rx="11" fill="#ece8ff"/>
      <text x="621" y="319" text-anchor="middle" fill="#1a1a5e" font-weight="700">複製 lihi.cc/brand</text>
    </g>

    <rect x="226" y="359" width="116" height="26" rx="13" fill="#ffe3ed"/>
    <text x="284" y="377" text-anchor="middle" fill="#b62d61" font-size="11" font-weight="700">網域・標籤・UTM</text>
  </g>
</svg>
