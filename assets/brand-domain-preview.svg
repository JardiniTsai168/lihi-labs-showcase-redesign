<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title description">
  <title id="title">品牌網域只要一美元功能預覽</title>
  <desc id="description">為專案申請專屬品牌網域，建立更有辨識度的分享連結</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#fffafd"/>
      <stop offset="1" stop-color="#f2efff"/>
    </linearGradient>
    <linearGradient id="brand" x2="1" y2="1">
      <stop stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#1a1a5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1a1a5e" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="800" height="450" rx="34" fill="url(#background)"/>
  <circle cx="700" cy="72" r="112" fill="#ffd7e4" opacity=".68"/>
  <circle cx="92" cy="392" r="122" fill="#e9e5ff" opacity=".74"/>

  <g font-family="Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="64" y="74" width="672" height="302" rx="30" fill="#fffdfd"/>
    </g>

    <rect x="64" y="74" width="672" height="58" rx="30" fill="#1a1a5e"/>
    <path d="M64 103h672v29H64z" fill="#1a1a5e"/>
    <circle cx="94" cy="103" r="7" fill="#ff6b9d"/>
    <circle cx="116" cy="103" r="7" fill="#fff" opacity=".5"/>
    <text x="146" y="110" fill="#fff" font-size="17" font-weight="700">專案品牌網域</text>

    <rect x="94" y="162" width="430" height="76" rx="18" fill="#fff0f5" stroke="#ff6b9d" stroke-opacity=".28"/>
    <circle cx="130" cy="200" r="17" fill="#ff6b9d"/>
    <path d="M120 200h20M130 190v20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="162" y="193" fill="#1a1a5e" font-size="13" font-weight="700" opacity=".62">你的專屬網域</text>
    <text x="162" y="218" fill="#1a1a5e" font-size="24" font-weight="700">yourbrand.link</text>

    <path d="M310 260v34" fill="none" stroke="#ff6b9d" stroke-width="4" stroke-linecap="round"/>
    <path d="m299 284 11 12 11-12" fill="none" stroke="#ff6b9d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="94" y="306" width="430" height="42" rx="13" fill="#f4f1ff"/>
    <text x="116" y="332" fill="#1a1a5e" font-size="15">yourbrand.link/campaign</text>
    <rect x="436" y="316" width="66" height="22" rx="11" fill="#1a1a5e"/>
    <text x="469" y="331" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">已啟用</text>

    <rect x="554" y="162" width="152" height="186" rx="24" fill="url(#brand)"/>
    <text x="630" y="198" fill="#fff" font-size="12" font-weight="700" letter-spacing="1.6" text-anchor="middle">限時方案</text>
    <text x="630" y="272" fill="#fff" font-size="68" font-weight="700" text-anchor="middle">$1</text>
    <text x="630" y="305" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">申請品牌網域</text>
    <circle cx="630" cy="329" r="5" fill="#ffb2cb"/>
  </g>
</svg>
